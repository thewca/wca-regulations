name: Deploy To S3

on:
  push:
    branches: [ official ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3
      uses: actions/setup-python@v2
      with:
        python-version: '3.13'
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::285938427530:role/wca-regulations-github-deploy-production
        aws-region: us-west-2
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install wrc
        # install wkhtmltopdf
        wget https://github.com/wkhtmltopdf/wkhtmltopdf/releases/download/0.12.4/wkhtmltox-0.12.4_linux-generic-amd64.tar.xz -O wkhtml.tar.xz && sudo tar -xf wkhtml.tar.xz --strip-components=1 -C /usr/local
    - name: Deploy to S3
      run: |
        outputdir=/tmp/regulations
        mkdir -p $outputdir
        git_hash=$(git rev-parse --short "$GITHUB_SHA")
        wrc --target=json -g $git_hash -o $outputdir ./wca-regulations.md
        wrc --target=html -g $git_hash -o $outputdir ./wca-regulations.md
        wrc --target=pdf -g $git_hash -o $outputdir ./wca-regulations.md
        # Update version
        echo "$git_hash" > $outputdir/version
        aws s3 sync $outputdir s3://wca-regulations/ --acl public-read
        # Copy over the current latest version to history
        date_str=$(cat $outputdir/index.html.erb | grep -oP 'Version: \K[A-Za-z]+ \d{1,2}, \d{4}')
        formatted_date=$(date -d "$date_str" +"%Y-%m-%d")
        aws s3 cp s3://wca-regulations/wca-regulations.pdf s3://wca-regulations/history/official/$formatted_date/wca-regulations.pdf --acl public-read
        aws s3 cp s3://wca-regulations/index.html.erb s3://wca-regulations/history/official/$formatted_date/index.html.erb --acl public-read
